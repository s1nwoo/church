plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.7'
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.banghwa'
version = '1.0.0'
sourceCompatibility = '17'

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += '-parameters' // ✅ @RequestParam 자동 인식용
}

dependencies {

    // JWT 라이브러리
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly   'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly   'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // 🌐 Spring Web - 웹 애플리케이션(컨트롤러, API 등)을 만들기 위한 필수 의존성
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // 🖼️ Thymeleaf - HTML 화면(View)을 템플릿 엔진으로 렌더링하는 데 사용됨
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // ✅ Spring Security - 로그인, 권한 관리 등 보안 기능을 위한 의존성
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // 🔁 개발 편의 기능 - 코드 수정 후 서버 자동 재시작 등
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // 🧪 테스트 관련 - 단위 테스트, 통합 테스트에 필요한 의존성
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // 🔐 Thymeleaf에서 Spring Security 정보(로그인/권한 등)를 사용 가능하게 해주는 확장 라이브러리
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    // ✅ Lombok 컴파일용
    compileOnly 'org.projectlombok:lombok:1.18.30'

    // ✅ IDE용 프로세서
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // 🧱 JPA (데이터베이스 연동 및 ORM 기능 제공)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // 🛢️ MySQL JDBC 드라이버 (MySQL과 연결하기 위해 필요)
    runtimeOnly 'com.mysql:mysql-connector-j'

    // ✅ 단위 테스트용 (JUnit 5 - Jupiter)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // ✅ AssertJ (가독성 좋은 테스트 assertion)
    testImplementation 'org.assertj:assertj-core:3.24.2'

    // ✅ JPA 테스트용 (H2 기반, 슬라이스 테스트)
    testImplementation 'org.springframework.boot:spring-boot-test-autoconfigure'

    // ⭐ PostgreSQL 드라이버 추가
    runtimeOnly 'org.postgresql:postgresql'

    // YouTube Data API
    implementation 'com.google.apis:google-api-services-youtube:v3-rev20231011-2.0.0'
    implementation 'com.google.api-client:google-api-client:2.2.0'
    implementation 'com.google.http-client:google-http-client-jackson2:1.43.3'

    // HTTP 클라이언트 (썸네일 다운로드용)
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.2.1'

}

test {
    useJUnitPlatform() // JUnit5 사용하도록 명시
}
